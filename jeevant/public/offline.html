<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Jeevant OS</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: #07080a;
        color: #e7e5e4;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        padding: 24px;
      }
      main { max-width: 26rem; width: 100%; border: 1px solid #262626; padding: 28px; }
      p { color: #a3a3a3; font-size: 13px; line-height: 1.7; }
      .label { color: #34d399; font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; }
      a {
        display: inline-block;
        margin-top: 18px;
        border: 1px solid #065f46;
        background: rgba(6, 95, 70, 0.2);
        color: #6ee7b7;
        padding: 10px 16px;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">Connection lost</p>
      <h1>Offline</h1>
      <p>
        The network is unreachable. No private page or API response is cached, so
        nothing personal is shown here. Reconnect and retry.
      </p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
